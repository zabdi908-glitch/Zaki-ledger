<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div style="min-height:100vh;background:oklch(14% 0.01 260);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;font-family:'Inter',system-ui,sans-serif">
  <div style="width:100%;max-width:1000px;aspect-ratio:924/561;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);position:relative;background:#fff">
    <img src="{{currentSrc}}" style="width:100%;height:100%;object-fit:cover;display:block" />
  </div>
  <div style="display:flex;align-items:center;gap:16px;margin-top:20px">
    <button onClick="{{ prev }}" style="width:36px;height:36px;border-radius:50%;border:none;background:oklch(30% 0.02 260);color:white;font-size:16px;cursor:pointer">‹</button>
    <button onClick="{{ togglePlay }}" style="width:44px;height:44px;border-radius:50%;border:none;background:white;color:oklch(20% 0.02 260);font-size:16px;cursor:pointer;font-weight:700">{{ playIcon }}</button>
    <button onClick="{{ next }}" style="width:36px;height:36px;border-radius:50%;border:none;background:oklch(30% 0.02 260);color:white;font-size:16px;cursor:pointer">›</button>
  </div>
  <div style="display:flex;gap:6px;margin-top:16px">
    <sc-for list="{{ dots }}" as="dot" hint-placeholder-count="12">
      <div onClick="{{ dot.onClick }}" style="width:{{ dot.width }};height:6px;border-radius:3px;background:{{ dot.bg }};cursor:pointer;transition:width 0.2s"></div>
    </sc-for>
  </div>
  <div style="color:oklch(70% 0.01 260);font-size:13px;margin-top:14px">{{ caption }}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { i: 0, playing: true };
  slides = [
    { src: 'screenshots/01-walkthrough.png', label: 'Dashboard' },
    { src: 'screenshots/03-walkthrough.png', label: 'Upload & Extract — drop zone' },
    { src: 'screenshots/04-walkthrough.png', label: 'Upload & Extract — 12 items extracted' },
    { src: 'screenshots/05-walkthrough.png', label: 'Review & Edit' },
    { src: 'screenshots/06-walkthrough.png', label: 'Batch Review' },
    { src: 'screenshots/07-walkthrough.png', label: 'Bank Reconciliation — Upload Statement' },
    { src: 'screenshots/08-walkthrough.png', label: 'Bank Reconciliation — matched summary' },
    { src: 'screenshots/09-walkthrough.png', label: 'Review Matches' },
    { src: 'screenshots/10-walkthrough.png', label: 'Reconciliation Batch Review' },
    { src: 'screenshots/11-walkthrough.png', label: 'Settings' },
    { src: 'screenshots/12-walkthrough.png', label: 'Auto-Categorize (Coming soon)' }
  ];

  componentDidMount() { this.startTimer(); }
  componentWillUnmount() { clearInterval(this._t); }
  startTimer() { clearInterval(this._t); this._t = setInterval(() => this.next(), 2600); }

  next = () => this.setState((s) => ({ i: (s.i + 1) % this.slides.length }));
  prev = () => this.setState((s) => ({ i: (s.i - 1 + this.slides.length) % this.slides.length }));
  goTo(i) { this.setState({ i }); }
  togglePlay = () => this.setState((s) => {
    const playing = !s.playing;
    if (playing) this.startTimer(); else clearInterval(this._t);
    return { playing };
  });

  renderVals() {
    const s = this.state;
    return {
      currentSrc: this.slides[s.i].src,
      caption: this.slides[s.i].label,
      playIcon: s.playing ? '❚❚' : '▶',
      togglePlay: this.togglePlay, next: this.next, prev: this.prev,
      dots: this.slides.map((sl, idx) => ({
        onClick: () => this.goTo(idx),
        bg: idx === s.i ? 'white' : 'oklch(40% 0.01 260)',
        width: idx === s.i ? '20px' : '6px'
      }))
    };
  }
}

</script>
</body>
</html>
